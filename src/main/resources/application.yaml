# =====================================================================
# Configuración del Microservicio: shipment-service (LogiTrack)
# =====================================================================
spring:
  application:
    name: shipment-service

  # -----------------------------------------------------------------
  # Configuración de la Conexión a la Base de Datos Relacional (MySQL)
  # -----------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shipment_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:admin_logitrack}
    password: ${DB_PASSWORD:12345}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  # -----------------------------------------------------------------
  # Configuración de JPA e Hibernate (ORM)
  # -----------------------------------------------------------------
  jpa:
    hibernate:
      # 'update' valida el esquema y actualiza las tablas automáticamente sin perder datos existentes
      ddl-auto: update
    # Muestra en consola las sentencias SQL generadas por Hibernate
    show-sql: true
    properties:
      hibernate:
        # Formatea el SQL en la consola para una mejor legibilidad y depuración
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

    # Permite que Hibernate cree/actualice las tablas PRIMERO
    # antes de que Spring ejecute el script de datos iniciales (data.sql)
    defer-datasource-initialization: true

  # -----------------------------------------------------------------
  # Inicialización de Datos (Scripts SQL)
  # -----------------------------------------------------------------
  sql:
    init:
      # Fuerza la ejecución automática del archivo data.sql al arrancar el microservicio
      mode: always
# =====================================================================
# =====================================================================
# Configuración de Documentación Interactiva (OpenAPI 3 / Swagger)
# =====================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Ordena automáticamente las operaciones HTTP en la interfaz gráfica (GET, POST, etc.)
    operationsSorter: method

# =====================================================================
# Configuración de Niveles de Registro (Logging) para visualizar datos
# =====================================================================
logging:
  level:
    # Muestra las consultas SQL ejecutadas por Hibernate
    org.hibernate.SQL: DEBUG
    # Muestra los valores y parámetros reales enviados a la base de datos
    org.hibernate.orm.jdbc.bind: TRACE
    # Muestra la ejecución de los scripts de inicialización SQL (data.sql)
    org.springframework.jdbc.datasource.init: DEBUG